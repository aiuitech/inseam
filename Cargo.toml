[workspace]
resolver = "3"
members = [
    "crates/inseam-kernel",
    "crates/inseam-seams",
    "crates/inseam-plugins",
    "crates/inseam-wasm-host",
    "crates/inseam-cli",
    "crates/inseam-ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
inseam-kernel = { path = "crates/inseam-kernel" }
inseam-seams = { path = "crates/inseam-seams" }
inseam-plugins = { path = "crates/inseam-plugins" }
inseam-wasm-host = { path = "crates/inseam-wasm-host" }

anyhow = "1.0.104"
arrow-array = "58"
arrow-schema = "58"
async-trait = "0.1.89"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
futures = "0.3.33"
gethostname = "1.1.0"
lance-index = "9.0.0"
lancedb = "0.33.0"
mime_guess = "2.0.5"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
wasmtime = { version = "38", default-features = false, features = [
    "runtime", "component-model", "async", "cranelift", "parallel-compilation",
] }
wasmtime-wasi = { version = "38", default-features = false, features = ["p2"] }

proptest = "1.11.0"
tempfile = "3.27.0"

# Debuginfo dominates target/ on this tree: 520 crates (lance, datafusion,
# wasmtime) statically linked into every test binary. Dependency crates get
# none; workspace crates keep file/line tables, which is what backtraces and
# panic locations actually read. Set `debug = true` here when a step-debugging
# session needs locals and types.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
