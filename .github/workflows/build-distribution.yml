# Reusable build job for any inseam distribution (`design/releases.md`):
# the stock CLI calls it from release.yml; a private distribution calls it
# at the tag it pins `inseam-cli` to, so both binaries come off one
# pipeline — same toolchain pin, same `--locked`, same SHA-pinned actions.
#
#   jobs:
#     build:
#       uses: aiuitech/inseam/.github/workflows/build-distribution.yml@v0.2.0
#       with:
#         package: hosted-distribution
#         targets: '[{"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"}]'
#
# Each target builds natively (no cross compilation — the runner matches the
# target) and uploads `inseam-<target>.tar.gz` as an artifact named
# `inseam-<target>`. Checksums, the release, and the signed manifest are the
# caller's and the operator's business, in that order.

name: build-distribution

on:
  workflow_call:
    inputs:
      package:
        description: Cargo package whose `inseam` binary is built.
        type: string
        required: true
      targets:
        description: JSON list of {target, runner} pairs; the runner must match the target natively.
        type: string
        required: false
        default: >-
          [{"target":"aarch64-apple-darwin","runner":"macos-14"},
           {"target":"x86_64-apple-darwin","runner":"macos-13"},
           {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},
           {"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-22.04-arm"}]
      rust-toolchain:
        description: Rust toolchain version; keep in step with the workspace MSRV.
        type: string
        required: false
        default: "1.97.1"

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and package
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --package "$PACKAGE" --locked
          tar -czf "inseam-${TARGET}.tar.gz" -C target/release inseam

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inseam-${{ matrix.target }}
          path: inseam-${{ matrix.target }}.tar.gz
          if-no-files-found: error
