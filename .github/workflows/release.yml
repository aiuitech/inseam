# Builds the prebuilt `inseam` binaries and publishes a **draft** GitHub
# release with checksums.txt (`design/releases.md`). The draft stays
# invisible to `releases/latest` — and so to `inseam self update` and
# install.sh — until a maintainer signs and uploads the release manifest
# from their own machine with `cargo xtask release promote <tag>`, which is
# the only place the signing key exists. CI builds; it never signs.
#
# Same supply-chain posture as plugins.yml: actions pinned to full commit
# SHAs, no default permissions, `contents: write` granted only to the job
# that publishes.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build-distribution.yml
    with:
      package: inseam-cli

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum inseam-*.tar.gz > checksums.txt
          cat checksums.txt
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            inseam-*.tar.gz checksums.txt
