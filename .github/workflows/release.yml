# Builds the prebuilt `inseam` binaries install.sh downloads: on a v* tag,
# each platform builds the stock CLI distribution natively (no cross
# compilation — the runner matches the target), then one job assembles
# checksums.txt and publishes the GitHub release.
#
# Same supply-chain posture as plugins.yml: actions pinned to full commit
# SHAs, no default permissions, `contents: write` granted only to the job
# that publishes.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: x86_64-unknown-linux-gnu
            # Oldest supported LTS = oldest glibc the binary demands.
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and package
        run: |
          set -euo pipefail
          cargo build --release -p inseam-cli --locked
          tar -czf "inseam-${{ matrix.target }}.tar.gz" -C target/release inseam

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inseam-${{ matrix.target }}
          path: inseam-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum inseam-*.tar.gz > checksums.txt
          cat checksums.txt
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            inseam-*.tar.gz checksums.txt
