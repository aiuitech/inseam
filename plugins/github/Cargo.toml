[package]
name = "github"
version = "0.1.0"
edition = "2021"

# Standalone: the root workspace must not adopt this crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
