# The inseam plugin registry index (design/registry.md).
#
# This tree IS registry v0: every plugin listed here ships as a directory
# beside this file (source, artifact, manifest, golden checks, fixtures).
# Every entry names its publisher, whose key (`publishers.toml`) signs the
# plugin's release record (`<name>/<name>.release.toml` and `.minisig`) —
# the sha256 of every file the release is made of. CI re-verifies on every
# merge that each artifact rebuilds from its source, that the signature
# holds, and that the index and the signed record agree;
# `inseam plugin install` proves all of it again on the installing node
# before anything runs. A mismatch anywhere is a refusal, not a warning.
#
# After rebuilding an artifact, re-sign and re-index it in one step:
#   cargo xtask plugin sign <name>

[[plugin]]
name = "ocr"
version = "0.2.0"
description = "Transcribe text in images, root or linked, through the granted vision LLM"
publisher = "inseam"
artifact = "ocr/ocr.wasm"
sha256 = "db6c941d3de615fd84d49341775ddec43ff294f00ff8e8f2dcf87d9203adddff"

