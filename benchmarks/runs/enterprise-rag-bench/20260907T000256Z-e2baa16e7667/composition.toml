[[entry]]
id = "fs"
[entry.config]
host_id = "enterprise-rag-bench"
skip_hidden = true
gitignore = false
ignore = []

[[entry]]
id = "llm"
[entry.config]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
transform_model = "google/gemini-2.5-flash-lite"
transform_reasoning_effort = "none"
agent_model = "stealth/ox-alpha"
batch_requests_max = 5000

[[entry]]
id = "embedder"
[entry.config]
provider = "endpoint"
model = "openai/text-embedding-3-small"
dimensions = 384
vectors = "summaries"

[[entry]]
id = "markdown"
disabled = false

[[entry]]
id = "chunker"
disabled = true

[[entry]]
id = "finder"
[entry.config]
seeds = "both"
max_vector_distance = 0.5

[[entry]]
id = "summarizer"
[entry.config]
target_chars = 24000
keywords_max = 12
llm_call_budget = 0
llm_lane = "batch"

[[entry]]
id = "entities"
disabled = true

[[entry]]
id = "sweep"
[entry.config]
max_sources = 0
concurrency = 8
batch_concurrency = 65536
max_fragments_per_source = 400
max_depth = 6
max_content_bytes = 2000000
ignore = []
