# Golden checks for the `entity-extractor` linked transform
# (docs/plugins/validation.md): LLM entity extraction. Entities are keyed
# sprouts, not child fragments, so the expectations here use
# `keyed_contains`/`max_keyed`.

# The claim: the model's JSON array becomes keyed entity sprouts, and nothing
# is emitted as a child fragment.
[[check]]
name = "extracts named entities from the llm reply"
mimetype = "text/plain"
text = "Greg met Ada Lovelace in Toronto to plan the kitchen renovation."
llm_returns = '[{"name":"Ada Lovelace","kind":"person"},{"name":"Toronto","kind":"place"}]'

[check.expect]
min_fragments = 0
max_fragments = 0
keyed_contains = "Ada Lovelace"
max_keyed = 2

# The degrade path: no text and no LLM means no entities — never a guess.
[[check]]
name = "extracts nothing when starved"
mimetype = "text/plain"

[check.expect]
min_fragments = 0
max_fragments = 0
max_keyed = 0
