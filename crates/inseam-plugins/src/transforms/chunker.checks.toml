# Golden checks for the `chunker` linked transform (docs/plugins/validation.md):
# the structural fallback for text with no structure of its own.

# The claim: text splits into `contains`-related chunks that keep the
# parent's mimetype, so a chunk of JSON is still JSON to the index.
[[check]]
name = "chunks plain text under the parent mimetype"
mimetype = "text/plain"
text = """
First paragraph of a note about the garden.

Second paragraph, about the shed.
"""

[check.expect]
min_fragments = 1
relation = "contains"
mimetype = "text/plain"
fragment_contains = "garden"

# The degrade path: withheld text chunks into nothing.
[[check]]
name = "emits nothing when the text is withheld"
mimetype = "text/plain"

[check.expect]
min_fragments = 0
max_fragments = 0
